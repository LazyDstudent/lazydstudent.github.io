<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080b0f;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* GIF background — very dim */
  .bg-gif {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: url('https://c.tenor.com/3IMnx3vl2LwAAAAC/tenor.gif') center center / cover no-repeat;
    opacity: 0.50;
    pointer-events: none;
  }

  /* Dark overlay on top */
  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: rgba(8, 11, 15, 0.50);
    pointer-events: none;
  }

  /* GRID */
  .grid {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1px;
    background: rgba(255,255,255,0.03);
    min-height: 100vh;
    padding: 1px;
  }

  /* BOX — perfect square */
  .box {
    background: rgba(8, 11, 15, 0.80);
    border: 1px solid rgba(255,255,255,0.07);
    padding: 32px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    aspect-ratio: 1 / 1;
    backdrop-filter: blur(6px);
  }

  .box:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.18);
  }

  .box-title {
    font-family: 'IBM Plex Serif', serif;
    font-size: 16px;
    font-weight: 400;
    color: #ddd;
    line-height: 1.4;
    flex: 1;
  }

  .box-meta {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.22);
    letter-spacing: 0.04em;
  }

  .box-sev {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 2px 6px;
  }
  .box-sev.critical { color: rgba(255,100,80,0.65); border-color: rgba(255,100,80,0.2); }
  .box-sev.high     { color: rgba(255,180,60,0.55); border-color: rgba(255,180,60,0.18); }

  /* Empty */
  .empty {
    grid-column: 1/-1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .cursor {
    width: 2px; height: 32px;
    background: rgba(255,255,255,0.12);
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* MODAL */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #080b0f;
    display: none;
    flex-direction: column;
  }
  .modal.open { display: flex; }

  .modal-bar {
    height: 44px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    padding: 0 28px;
    flex-shrink: 0;
    background: rgba(8,11,15,0.98);
  }

  .modal-back {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    background: none;
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    padding: 5px 14px;
  }
  .modal-back:hover { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.3); }

  #postFrame { flex: 1; border: none; width: 100%; background: #fafaf8; }
</style>
</head>
<body>

<div class="bg-gif"></div>
<div class="bg-overlay"></div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-bar">
    <button class="modal-back" id="backBtn">← back</button>
  </div>
  <iframe id="postFrame" src="about:blank"></iframe>
</div>

<script>
// Named closeModal — avoids conflict with window.close()
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('postFrame').src = 'about:blank';
  document.body.style.overflow = '';
}

document.getElementById('backBtn').addEventListener('click', closeModal);
document.addEventListener('keydown', k => { if(k.key === 'Escape') closeModal(); });

async function load() {
  let posts = [];
  try {
    const r = await fetch('posts.json');
    if(r.ok) posts = await r.json();
  } catch(e) {}

  const grid = document.getElementById('grid');

  if(!posts.length) {
    grid.innerHTML = `<div class="empty"><div class="cursor"></div></div>`;
    return;
  }

  grid.innerHTML = posts.map(p => `
    <div class="box" onclick="openPost('${esc(p.file)}')">
      <div class="box-title">${esc(p.title)}</div>
      <div class="box-meta">
        <span>${esc(p.date||'')}</span>
        ${p.severity ? `<span class="box-sev ${p.severity.toLowerCase()}">${p.severity.toUpperCase()}</span>` : ''}
      </div>
    </div>`).join('');
}

function openPost(file) {
  const src = file.startsWith('http') ? file : 'posts/' + file;
  document.getElementById('postFrame').src = src;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
