<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080b0f;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Matrix canvas — full background */
  #matrix {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.18;
  }

  /* Overlay to dim bottom of matrix */
  .fade {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, #080b0f 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* GRID */
  .grid {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1px;
    background: rgba(255,255,255,0.04);
    min-height: 100vh;
    padding: 1px;
  }

  /* POST BOX */
  .box {
    background: rgba(8, 11, 15, 0.85);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 36px 32px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 200px;
    backdrop-filter: blur(4px);
  }

  .box:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.15);
  }

  .box-title {
    font-family: 'IBM Plex Serif', serif;
    font-size: 17px;
    font-weight: 400;
    color: #e0e0e0;
    line-height: 1.35;
    flex: 1;
  }

  .box-meta {
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.04em;
  }

  .box-sev {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 2px 6px;
  }
  .box-sev.critical { color: rgba(255,100,80,0.7); border-color: rgba(255,100,80,0.2); }
  .box-sev.high     { color: rgba(255,180,60,0.6); border-color: rgba(255,180,60,0.2); }

  /* Empty state — just a dim cursor */
  .empty {
    grid-column: 1/-1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .cursor {
    width: 2px; height: 32px;
    background: rgba(255,255,255,0.15);
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* MODAL — iframe fullscreen */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #080b0f;
    display: none;
    flex-direction: column;
  }
  .modal.open { display: flex; }

  .modal-bar {
    height: 40px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    padding: 0 28px;
    flex-shrink: 0;
  }

  .modal-back {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    background: none; border: none;
    cursor: pointer; letter-spacing: 0.05em;
    transition: color 0.15s;
    padding: 0;
  }
  .modal-back:hover { color: rgba(255,255,255,0.6); }

  #postFrame { flex: 1; border: none; width: 100%; }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="fade"></div>

<div class="grid" id="grid"></div>

<!-- Reader -->
<div class="modal" id="modal">
  <div class="modal-bar">
    <button class="modal-back" onclick="close()">←</button>
  </div>
  <iframe id="postFrame" src="about:blank"></iframe>
</div>

<script>
// ── MATRIX RAIN ──
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノABCDEF'.split('');
let drops = [];

function initMatrix() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const cols = Math.floor(canvas.width / 16);
  drops = Array(cols).fill(1);
}

function drawMatrix() {
  ctx.fillStyle = 'rgba(8,11,15,0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00ff41';
  ctx.font = '13px IBM Plex Mono, monospace';
  drops.forEach((y, i) => {
    const char = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(char, i * 16, y * 16);
    if(y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  });
}

initMatrix();
setInterval(drawMatrix, 50);
window.addEventListener('resize', initMatrix);

// ── POSTS ──
async function load() {
  let posts = [];
  try {
    const r = await fetch('posts.json');
    if(r.ok) posts = await r.json();
  } catch(e) {}

  const grid = document.getElementById('grid');

  if(!posts.length) {
    grid.innerHTML = `<div class="empty"><div class="cursor"></div></div>`;
    return;
  }

  grid.innerHTML = posts.map((p, i) => `
    <div class="box" onclick="open_('${e(p.file)}','${e(p.title)}')">
      <div class="box-title">${e(p.title)}</div>
      <div class="box-meta">
        <span>${e(p.date||'')}</span>
        ${p.severity ? `<span class="box-sev ${p.severity.toLowerCase()}">${p.severity.toUpperCase()}</span>` : ''}
      </div>
    </div>`).join('');
}

function open_(file, title) {
  const src = file.startsWith('http') ? file : 'posts/' + file;
  document.getElementById('postFrame').src = src;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function close() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('postFrame').src = 'about:blank';
  document.body.style.overflow = '';
}

function e(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('keydown', k => { if(k.key==='Escape') close(); });
load();
</script>
</body>
</html>
