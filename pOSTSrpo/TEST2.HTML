<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>saDSA</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fafaf8;color:#111;font-family:'IBM Plex Serif',serif;font-size:16px;line-height:1.7;}
.wrap{max-width:740px;margin:0 auto;padding:64px 40px 120px;}
.post-head{border-bottom:2px solid #111;padding-bottom:28px;margin-bottom:36px;}
.post-title{font-size:30px;font-weight:400;line-height:1.25;margin-bottom:20px;letter-spacing:-0.01em;}
.meta{display:flex;align-items:center;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#888;letter-spacing:0.04em;flex-wrap:wrap;}
.tags{display:flex;gap:6px;flex-wrap:wrap;}
.tag{font-family:'IBM Plex Mono',monospace;font-size:9px;border:1px solid #ddd;padding:2px 7px;color:#888;letter-spacing:0.05em;text-transform:uppercase;}
.sev{font-family:'IBM Plex Mono',monospace;font-size:9px;border:1px solid #ddd;padding:2px 7px;letter-spacing:0.08em;text-transform:uppercase;}
.sev.critical{color:#c0392b;border-color:#e0b0b0;}
.sev.high{color:#b7700a;border-color:#e8d5a0;}
.sev.medium{color:#7a6800;border-color:#e0d880;}
.sev.low,.sev.info{color:#888;}
.body h1,.body h2{font-size:20px;font-weight:600;margin:36px 0 14px;padding-bottom:8px;border-bottom:1px solid #ddd;line-height:1.3;}
.body h3{font-size:16px;font-weight:600;margin:24px 0 10px;}
.body h4{font-size:14px;font-weight:600;margin:18px 0 8px;color:#444;}
.body p{margin-bottom:16px;}
.body pre{background:#f4f4f2;border:1px solid #ddd;border-left:3px solid #111;padding:16px 20px;overflow-x:auto;margin:18px 0;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.65;}
.body code{font-family:'IBM Plex Mono',monospace;font-size:12px;background:#f4f4f2;border:1px solid #ddd;padding:1px 5px;}
.body pre code{background:none;border:none;padding:0;}
.body img{max-width:100%;border:1px solid #ddd;display:block;margin:20px 0;}
.body ul,.body ol{padding-left:22px;margin-bottom:16px;}
.body li{margin-bottom:5px;}
.body blockquote{border-left:3px solid #ddd;padding-left:18px;margin:18px 0;color:#777;font-style:italic;}
.body a{color:#111;text-decoration:underline;}
.body strong{font-weight:600;}
.body em{font-style:italic;}
.body table{width:100%;border-collapse:collapse;margin:18px 0;font-size:13px;font-family:'IBM Plex Mono',monospace;}
.body th{background:#f4f4f2;border:1px solid #ddd;padding:8px 12px;text-align:left;font-size:10px;letter-spacing:0.05em;text-transform:uppercase;}
.body td{border:1px solid #ddd;padding:8px 12px;}
.body hr{border:none;border-top:1px solid #ddd;margin:28px 0;}
.body mark{background:#fef08a;padding:0 2px;}
.body del{text-decoration:line-through;color:#999;}
</style>
</head>
<body>
<div class="wrap">
  <div class="post-head">
    <h1 class="post-title">saDSA</h1>
    <div class="meta">
      <span>2026-02-24</span>
      <span>ASDASD read</span>
      <span class="sev medium">MEDIUM</span>
      
    </div>
  </div>
  <div class="body"><p>ASDAS</p>
</div>
</div>
</body>
</html>
